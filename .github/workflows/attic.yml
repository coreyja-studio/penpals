name: attic

# Build the image and push it to attic (coreyja-studio/infra). Deploying is
# pinning the printed digest in infra's hosts/attic/apps/penpals/compose.yml.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  image:
    uses: coreyja-studio/.github/.github/workflows/attic-deploy.yml@main
    with:
      app: penpals
    permissions:
      contents: read
      packages: write
      id-token: write
